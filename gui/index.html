<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent Usage</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    background: #1e222a;
    color: #e6e9ef;
    border: 1px solid #3a3f4b;
    border-radius: 8px;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 6px;
  }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; }
  header .meta { font-size: 11px; color: #8a90a0; }
  #refresh {
    background: none; border: none; color: #8a90a0; cursor: pointer; font-size: 13px;
  }
  #refresh:hover { color: #e6e9ef; }
  main { padding: 4px 12px 12px; max-height: 380px; overflow-y: auto; }
  section { margin-bottom: 14px; }
  section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: #8a90a0; margin: 0 0 6px;
  }
  .row { margin-bottom: 8px; }
  .row-label {
    display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px;
  }
  .row-label .pct { font-variant-numeric: tabular-nums; color: #c7cbd6; }
  .row-label .resets { color: #6b7180; font-size: 11px; }
  .bar { height: 6px; border-radius: 3px; background: #2b303b; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 3px; }
  .lvl-ok > span { background: #4caf50; }
  .lvl-warn > span { background: #f5a623; }
  .lvl-crit > span { background: #e5484d; }
  .error { color: #e5484d; font-size: 12px; }
  .empty { color: #6b7180; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>agent-usage</h1>
    <div>
      <span class="meta" id="updated"></span>
      <button id="refresh" title="Refresh now">&#8635;</button>
    </div>
  </header>
  <main id="content">
    <p class="empty">Loading…</p>
  </main>
  <script type="module" src="renderer.mjs"></script>
</body>
</html>
