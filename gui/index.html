<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent Usage</title>
<style>
  /* Palette. The theme follows prefers-color-scheme, which the app drives via
     nativeTheme (tray menu → Theme). Text colours meet WCAG AA (4.5:1) on
     --bg and bar colours meet 3:1 on --track — enforced by
     test/gui-contrast.test.mjs, which reads these two blocks. */
  :root {
    color-scheme: dark light;
    --bg: #1e222a;
    --border: #3a3f4b;
    --fg: #e6e9ef;
    --fg-strong: #c7cbd6;
    --muted: #9aa1b2;
    --track: #2b303b;
    --ok: #4caf50;
    --warn: #f5a623;
    --crit: #e5484d;
    --error: #ff7b7f;
    --warn-text: #f5a623;
    --focus: #8ab4ff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9;
      --border: #cfd3dc;
      --fg: #1b1e25;
      --fg-strong: #2a2f3a;
      --muted: #555b6a;
      --track: #d9dde5;
      --ok: #2e7d32;
      --warn: #b26a00;
      --crit: #c62828;
      --error: #b3261e;
      --warn-text: #8a5300;
      --focus: #1a56c4;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 6px;
    -webkit-app-region: drag;
  }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; }
  header .meta { font-size: 11px; color: var(--muted); }
  header .actions { -webkit-app-region: no-drag; display: flex; gap: 4px; align-items: center; }
  #refresh, #hide {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px;
    /* WCAG 2.2 target size: at least 24x24 CSS px. */
    min-width: 24px; min-height: 24px; padding: 2px 4px; border-radius: 4px;
  }
  #refresh:hover, #hide:hover { color: var(--fg); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  main { padding: 4px 12px 12px; max-height: 380px; overflow-y: auto; }
  section { margin-bottom: 14px; }
  section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 0 0 6px;
  }
  .row { margin-bottom: 8px; }
  .row-label {
    display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px;
  }
  .row-label .pct { font-variant-numeric: tabular-nums; color: var(--fg-strong); }
  .row-label .resets { color: var(--muted); font-size: 11px; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 3px; }
  .lvl-ok > span { background: var(--ok); }
  .lvl-warn > span { background: var(--warn); }
  .lvl-crit > span { background: var(--crit); }
  .error { color: var(--error); font-size: 12px; }
  .empty { color: var(--muted); font-size: 12px; }
  /* Last good reading kept on screen after a failed refresh. Flagged by the
     badge and note text; the edge is an extra cue. Not dimmed, so text and
     bars keep their contrast. */
  section.stale { border-left: 3px solid var(--warn-text); padding-left: 8px; }
  .badge { color: var(--warn-text); text-transform: none; letter-spacing: 0; margin-left: 4px; }
  .stale-note { color: var(--warn-text); font-size: 11px; margin: 0; word-break: break-word; }

  /* Compact: narrower, taller window — same layout, tighter spacing. */
  body[data-layout="compact"] header { padding: 8px 10px 4px; }
  body[data-layout="compact"] header .meta { display: none; }
  body[data-layout="compact"] main { padding: 4px 10px 10px; max-height: 520px; }
  body[data-layout="compact"] section { margin-bottom: 10px; }
  body[data-layout="compact"] .row { margin-bottom: 6px; }
  body[data-layout="compact"] .row-label { font-size: 11px; }

  /* Mini: a thin vertical strip — drop everything but bars and percentages. */
  body[data-layout="mini"] header { padding: 6px 8px 2px; }
  body[data-layout="mini"] header h1 { display: none; }
  body[data-layout="mini"] header .meta { display: none; }
  body[data-layout="mini"] main { padding: 2px 8px 8px; max-height: 600px; }
  body[data-layout="mini"] section { margin-bottom: 8px; }
  body[data-layout="mini"] section h2 { font-size: 10px; margin-bottom: 4px; }
  body[data-layout="mini"] .row { margin-bottom: 5px; }
  body[data-layout="mini"] .row-label {
    flex-direction: column; align-items: flex-start; gap: 1px; font-size: 10.5px;
  }
  body[data-layout="mini"] .row-label .resets { display: none; }
  body[data-layout="mini"] .stale-note { display: none; }
  body[data-layout="mini"] .bar { height: 5px; }
</style>
</head>
<body>
  <header>
    <h1>agent-usage</h1>
    <div class="actions">
      <span class="meta" id="updated"></span>
      <button id="refresh" type="button" title="Refresh now" aria-label="Refresh now">&#8635;</button>
      <button id="hide" type="button" title="Hide (reopen from the tray icon)" aria-label="Hide (reopen from the tray icon)">&#10005;</button>
    </div>
  </header>
  <main id="content" aria-label="Rate-limit usage">
    <p class="empty">Loading…</p>
  </main>
  <script type="module" src="renderer.mjs"></script>
</body>
</html>
