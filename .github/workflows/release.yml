name: release

# Pushing a tag like v0.2.0 builds the Windows tray app and attaches the
# installer, portable exe and update feed (latest.yml) to that tag's GitHub
# Release (created if missing).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag must match the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in package.json gui/package.json; do
            version="$(node -p "require('./$pkg').version")"
            if [ "$version" != "$tag" ]; then
              echo "::error file=$pkg::version $version does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: npm test

      - name: Build installer and portable exe
        working-directory: gui
        run: |
          npm ci
          npm run dist
        env:
          # Unsigned unless a code-signing certificate is configured:
          # add CSC_LINK / CSC_KEY_PASSWORD as repository secrets and
          # electron-builder will pick them up automatically.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # latest.yml and the .blockmap are what the installed app reads to find
      # and verify an update (electron-updater), so they ship with the exes.
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(gui/dist/agent-usage-gui-*.exe gui/dist/agent-usage-gui-*.blockmap gui/dist/latest.yml)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
